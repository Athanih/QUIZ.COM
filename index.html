<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProQuiz Batik Jogja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container main">
        <div class="batik-frame" aria-hidden="true"></div>
        <section class="quiz-card" aria-label="Kuis matematika">
            <div class="brand-mark">PROQUIZ JOGJA</div>
            <div class="tugu-jogja" role="img" aria-label="Siluet Tugu Jogja">
                <span class="tugu-spire"></span>
                <span class="tugu-cap"></span>
                <span class="tugu-column"></span>
                <span class="tugu-base"></span>
            </div>
            <p class="eyebrow">Tantangan dari Yogyakarta</p>
            <h1>Asah kemampuanmu</h1>
            <div class="batik-divider" aria-hidden="true"><span></span></div>
            <div class="quiz-meta">
                <span class="location-tag">YOGYAKARTA · 1755</span>
                <span class="question-count">SOAL 1 / 20</span>
                <span class="score-count">NILAI 0</span>
            </div>
            <div class="progress-track" aria-label="Progres kuis"><span class="progress-bar"></span></div>
            <div class="question">23 - 7</div>
            <p class="prompt">Pilih jawaban yang paling tepat</p>
            <div class="ans-row">
                <div class="answer">2</div>
                <div class="answer">4</div>
                <div class="answer">16</div>
                <div class="answer">20</div>
                <div class="answer">19</div>
            </div>
            <p class="answer-feedback" aria-live="polite"></p>
            <div class="result-panel" aria-live="polite">
                <strong class="result-score">0 / 20</strong>
                <span class="result-label">Jawab soal untuk melihat nilai</span>
            </div>
            <div class="motif-list" aria-label="Motif batik Jogja">
                <span>PARANG</span>
                <span>KAWUNG</span>
                <span>TRUNTUM</span>
            </div>
            <p class="heritage-note">Belajar dengan sentuhan warisan Nusantara</p>
        </section>
</main>
</body>
<script src="custom.js"></script>
</html>
